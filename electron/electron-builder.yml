appId: com.videobrain.app
productName: VideoBrain
directories:
  output: dist
files:
  - main.js
  - preload.js
  - bin/**/*
  - "!node_modules/**/*"
asar: true
electronDist: bin
electronVersion: 20.18.0
forceCodeSigning: false
win:
  target:
    - target: portable
      arch:
        - x64
  icon: ../videobrain.ico
  sign: false
portable:
  artifactName: VideoBrain-Portable-${version}.exe
